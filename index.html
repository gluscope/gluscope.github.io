<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLUScope</title>
  <meta name="description" content="Browse GLU neuron activations across language models, layers and neurons.">
  <link rel="stylesheet" href="assets/gluscope.css">
</head>

<body class="gs-index">

  <header class="gs-header">
    <div class="gs-header-inner">
      <a class="gs-wordmark" href="./">
        <span class="gs-mark" aria-hidden="true"></span>GLUScope
      </a>
    </div>
  </header>

  <main class="gs-container">

    <div class="gs-hero">
      <h1>Browse neurons</h1>
      <p id="gs-summary">Loading&hellip;</p>
    </div>

    <div class="gs-error" id="gs-error" hidden></div>

    <div class="gs-box gs-picker">
      <div class="gs-box-header">Select a neuron</div>
      <div class="gs-box-body">

        <div class="gs-field">
          <label for="modelSelect">Model</label>
          <select class="gs-select" id="modelSelect" disabled>
            <option>Loading&hellip;</option>
          </select>
        </div>

        <div class="gs-field">
          <label for="layerSelect">Layer</label>
          <select class="gs-select" id="layerSelect" disabled>
            <option>Select a model first</option>
          </select>
        </div>

        <div class="gs-field">
          <label for="neuronSelect">Neuron</label>
          <select class="gs-select" id="neuronSelect" disabled>
            <option>Select a layer first</option>
          </select>
        </div>

        <div class="gs-actions">
          <a class="gs-btn gs-btn--primary" id="openBtn" aria-disabled="true">Open neuron</a>
          <span class="gs-muted" id="openHint">Choosing a neuron opens it straight away.</span>
        </div>

      </div>
    </div>

  </main>

  <script type="module" src="assets/gluscope-index.js"></script>
</body>
</html>
